# Component: connman (opt-in package: ConnMan + D-Bus)
header:
  version: 23

target: aember-pkg-connman

# wpa-supplicant is a ConnMan dependency (built, not shipped: the "wifi"
# package has it); AEMBER_WIFI keeps it the same small wolfSSL build.
repos:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: master
    commit: df6a14a27c81675f31da3c488d35f07ee413afb5
    layers:
      meta-oe:
      meta-networking:
      meta-python:

local_conf_header:
  aember-connman: |
    # Ethernet + Wi-Fi (wpa_supplicant), nftables as the firewall backend;
    # no WISPr (gnutls), VPN, Bluetooth or 3G. No `client` (connmanctl):
    # it links GNU readline (GPL-3.0-or-later), whose installation-
    # information clause conflicts with locked devices (v0.1.16, aember's
    # doc/licensing). ConnMan is driven over D-Bus (dbus-send, or the
    # application's own D-Bus client).
    PACKAGECONFIG:pn-connman = "wifi wpa-supplicant nftables"
    # ...and so no connman-client package to install. Removed here, not in
    # meta-aember's recipe, so only this package's CAS key changes.
    AEMBER_PACKAGE_INSTALL:remove:pn-aember-pkg-connman = "connman-client"
    AEMBER_WIFI = "1"
    PACKAGECONFIG:pn-wpa-supplicant = ""
    EXTRA_OECONF:append:pn-wolfssl = " --enable-wpas"
