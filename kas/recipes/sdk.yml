# Component: sdk — Poky cross toolchain + target sysroot (GCC 15, C++23).
# The aember CLI runs the generated installer into yocto/build/<arch>/sdk.
header:
  version: 23

target: core-image-minimal
task: populate_sdk

# Qt for aember-monitor (and any other Qt app): only the SDK builds get these
# layers, so the kernel, BusyBox and LXC keys don't change. Pinned close to
# poky's commit (2025-08-14): meta-qt6 6.10 still declares compatibility
# from kirkstone to whinlatter.
repos:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: master
    commit: df6a14a27c81675f31da3c488d35f07ee413afb5
    layers:
      meta-oe:
      meta-python:
  meta-qt6:
    url: https://code.qt.io/yocto/meta-qt6.git
    branch: "6.10"
    commit: dde433960e840b342cd9005e66637b7057dcb011

local_conf_header:
  aember-sdk: |
    # Ship liblxc, its headers and lxc.pc in the SDK target sysroot so C++
    # code can build against LXC (aember-lxc-dev pulls in aember-lxc).
    TOOLCHAIN_TARGET_TASK:append = " aember-lxc-dev"
  aember-sdk-sanitizers: |
    # GCC's sanitizer runtimes (libasan, libubsan; liblsan and libtsan where
    # GCC supports them: not on arm32) in the target sysroot, so aember's
    # tests build and run with -fsanitize=address,undefined / thread
    # (`aember test --sanitize`). The SDK's dev-pkgs feature adds their -dev
    # packages (link-time .so symlinks).
    TOOLCHAIN_TARGET_TASK:append = " gcc-sanitizers"
  aember-sdk-headless-qemu: |
    # The SDK's QEMU links SDL, virglrenderer and epoxy because poky enables
    # opengl. They pull nativesdk-mesa, which needs clang/LLVM twice (native
    # and nativesdk, ~2 h) and ships a 133 MB libLLVM. Nothing in aember runs
    # the SDK's QEMU with a display, so build it headless.
    PACKAGECONFIG:remove:pn-nativesdk-qemu = "sdl virglrenderer epoxy"
  aember-sdk-parallelism: |
    # The SDK pulls in clang-native, whose LLVM C++ sources OOM-kill cc1plus
    # at the default 16 tasks x -j16 on a 15 GB host. Cap concurrent tasks
    # and make jobs so the build fits in memory.
    BB_NUMBER_THREADS = "4"
    PARALLEL_MAKE = "-j 8"
  aember-sdk-qt: |
    # A minimal Qt 6 (qtbase) in every SDK, for small framebuffer UIs such
    # as aember-monitor: Core + Gui with the linuxfb platform plugin and the
    # raster paint engine. No OpenGL, widgets, ICU, DBus, fontconfig, input
    # stack or OpenSSL: the app ships its own font. moc/rcc for the host come
    # from nativesdk-qtbase-tools.
    PACKAGECONFIG:pn-qtbase = "gui linuxfb no-opengl png zlib"
    # Poky's ptest would build Qt's whole autotest suite (thousands of
    # binaries, hours per architecture) for an SDK that never ships them.
    QT_PTEST_ENABLED = "0"
    TOOLCHAIN_TARGET_TASK:append = " qtbase qtbase-dev qtbase-plugins"
    TOOLCHAIN_HOST_TASK:append = " nativesdk-qtbase-tools nativesdk-qtbase-dev"
  aember-sdk-qt-memory: |
    # Qt's C++ compiles take up to ~1 GB per cc1plus, and qtbase,
    # qtbase-native and nativesdk-qtbase can build at the same time: four
    # jobs each keeps the peak well inside the 15 GB WSL (PARALLEL_MAKE is
    # not part of task signatures).
    PARALLEL_MAKE:pn-qtbase = "-j 4"
    PARALLEL_MAKE:pn-qtbase-native = "-j 4"
    PARALLEL_MAKE:pn-nativesdk-qtbase = "-j 4"
