# riscv64 LXC container config — aember
# Include base config
lxc.include = /etc/lxc/lxc.conf

# riscv64 architecture
lxc.arch = riscv64

# Console via ttyS0 (QEMU virt / 16550 UART)
lxc.console.path = /dev/ttyS0
lxc.tty.max = 4

# Allow tty/console devices
lxc.cgroup2.devices.allow = c 4:* rwm
lxc.cgroup2.devices.allow = c 5:* rwm
