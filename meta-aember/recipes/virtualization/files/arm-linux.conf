# 32-bit ARM LXC container config — aember
# Include base config
lxc.include = /etc/lxc/lxc.conf

# armv7 architecture
lxc.arch = armv7l

# Console via ttyAMA0 (QEMU virt / PL011 UART)
lxc.console.path = /dev/ttyAMA0
lxc.tty.max = 4

# Allow tty/console devices
lxc.cgroup2.devices.allow = c 4:* rwm
lxc.cgroup2.devices.allow = c 5:* rwm
