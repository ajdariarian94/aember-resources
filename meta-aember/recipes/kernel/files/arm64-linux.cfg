# ===============================
# Architecture
# ===============================
CONFIG_ARM64=y
CONFIG_64BIT=y
CONFIG_MMU=y
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_48=y

# ===============================
# Early boot / console
# ===============================
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_SERIAL_CORE=y
CONFIG_SERIAL_CORE_CONSOLE=y
CONFIG_HVC_DRIVER=y

# Device Tree (required for ARM64)
CONFIG_OF=y
CONFIG_OF_FLATTREE=y
CONFIG_OF_EARLY_FLATTREE=y

# ===============================
# Init / PID1
# ===============================
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_INIT_ENV_ARG_LIMIT=32
CONFIG_DEFAULT_INIT="/init"

# ===============================
# Filesystems (minimal)
# ===============================
CONFIG_TMPFS=y
CONFIG_TMPFS_POSIX_ACL=n
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y

# ===============================
# Networking (basic, container-ready)
# ===============================
CONFIG_NET=y
CONFIG_INET=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_NETFILTER=y
# BRIDGE=y needs IPv6 built in (the arm64 defconfig has IPV6=m)
CONFIG_IPV6=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
CONFIG_NET_NS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y

# ===============================
# Storage (basic block + initramfs)
# ===============================
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_VIRTIO_BLK=y
CONFIG_EXT4_FS=y

# ARM-specific block devices
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y

# ===============================
# Device drivers (VM + bare metal friendly)
# ===============================
# PCI support (for servers/QEMU with PCI)
CONFIG_PCI=y
CONFIG_PCI_MSI=y
CONFIG_PCI_HOST_GENERIC=y

# VirtIO (QEMU/KVM support)
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y

# ARM-specific drivers
CONFIG_ARM_TIMER_SP804=y
CONFIG_COMMON_CLK=y

# Network drivers (common ARM platforms)
CONFIG_SMSC911X=y

# ===============================
# ARM64 Platform Support
# ===============================
# QEMU virt machine

# Optional: Raspberry Pi support
# CONFIG_ARCH_BCM=y
# CONFIG_ARCH_BCM2835=y

# Optional: Generic server platforms
# CONFIG_ARCH_THUNDER=y
# CONFIG_ARCH_XGENE=y

# ===============================
# Security / hardening (lightweight)
# ===============================
CONFIG_RANDOMIZE_BASE=y
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y

# ARM64-specific security
CONFIG_ARMV8_DEPRECATED=y
CONFIG_SWP_EMULATION=y
CONFIG_CP15_BARRIER_EMULATION=y
CONFIG_SETEND_EMULATION=y

# ===============================
# Debugging (off for size)
# ===============================
CONFIG_DEBUG_KERNEL=n
# CONFIG_DEBUG_FS and CONFIG_KALLSYMS stay on: the defconfig enables tracing
# (FTRACE, KPROBES, BLK_DEV_IO_TRACE), which selects both.
CONFIG_PRINTK=y

CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZSTD=y

# ===============================
# Framebuffer / Display (virtio-gpu for QEMU)
# ===============================
CONFIG_HAS_IOMEM=y
CONFIG_DMA_SHARED_BUFFER=y
CONFIG_SYNC_FILE=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE_DETECT_PRIMARY=y
CONFIG_FB_SYS_FILLRECT=y
CONFIG_FB_SYS_COPYAREA=y
CONFIG_FB_SYS_IMAGEBLIT=y
CONFIG_DRM=y
# KMS/GEM/TTM helpers are selected by DRM_VIRTIO_GPU (as modules)
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_VIRTIO_GPU_KMS=y

# ===============================
# Input (needed for display)
# ===============================
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_VIRTIO_INPUT=m
CONFIG_HID=y
CONFIG_USB_HID=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_DUMMY_CONSOLE=y

# ===============================
# Raspberry Pi 4 (BCM2711): built in, because aember loads modules only after
# switching to the root filesystem, which is on the SD card.
# ===============================
CONFIG_ARCH_BCM2835=y
CONFIG_RASPBERRYPI_FIRMWARE=y
CONFIG_BCM2835_MBOX=y
# SD card (emmc2) clock comes from the firmware
CONFIG_CLK_RASPBERRYPI=y
CONFIG_RESET_RASPBERRYPI=y
CONFIG_PINCTRL_BCM2835=y
CONFIG_MMC_SDHCI_IPROC=y
CONFIG_MMC_BCM2835=y
# GPIO 14/15 serial console (mini UART = ttyS1 with the mainline device tree)
CONFIG_SERIAL_8250_BCM2835AUX=y
# Ethernet
CONFIG_BCMGENET=y
CONFIG_BROADCOM_PHY=y
# USB (VL805 behind the PCIe root complex)
CONFIG_PCIE_BRCMSTB=y
CONFIG_USB_XHCI_PCI=y
# Thermal, CPU frequency (else the CPU stays at its lowest clock), watchdog
CONFIG_BCM2711_THERMAL=y
CONFIG_ARM_RASPBERRYPI_CPUFREQ=y
CONFIG_BCM2835_WDT=y

# Raspberry Pi 4 Wi-Fi: the BCM43455 on the SDIO bus (sdhci-iproc, already
# built in), powered through the device tree's mmc-pwrseq-simple. Firmware
# comes with aember's "wifi" package.
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y
CONFIG_PWRSEQ_SIMPLE=y
