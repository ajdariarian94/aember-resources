CONFIG_INIT_ENV_ARG_LIMIT=32
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y

# Container root filesystems (aember's modules.json loads "overlay")
CONFIG_OVERLAY_FS=y
# Container images are squashfs (zstd; xz kept for older images)
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZSTD=y
CONFIG_SQUASHFS_XZ=y

CONFIG_SYSTEM_TRUSTED_KEYS=""
# CONFIG_SYSTEM_REVOCATION_KEYS: only exists with SYSTEM_REVOCATION_LIST; the
# recipe empties it when present.

# LXC containers on cgroup2 (checked with lxc-checkconfig): memory
# controller, BPF device control, and the network devices/netfilter matches
# LXC setups use.
CONFIG_NETFILTER_ADVANCED=y
# Container NAT/firewall built in on every arch (the arm64 defconfig has
# these as modules; xtables matches can only be =y if xtables is)
CONFIG_NF_CONNTRACK=y
CONFIG_NF_NAT=y
CONFIG_NETFILTER_XTABLES=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_MANGLE=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_MEMCG=y
CONFIG_BPF_SYSCALL=y
CONFIG_CGROUP_BPF=y
CONFIG_TUN=y
CONFIG_FUSE_FS=y
CONFIG_MACVLAN=y
CONFIG_VLAN_8021Q=y
CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y
CONFIG_NETFILTER_XT_MATCH_COMMENT=y

# ===============================
# Watchdog: aember's PID 1 feeds /dev/watchdog. Boards bring their own
# driver (bcm2835_wdt on the Pi, arm64-linux.cfg); i6300esb is QEMU's PCI
# watchdog (-device i6300esb, a real countdown), so the watchdog, reset
# included, can be tested in QEMU on every architecture.
# ===============================
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_I6300ESB_WDT=y

# Wi-Fi (aember's opt-in package "wifi"): the 802.11 stack as modules, only
# loaded when a board lists them in modules.json; trim.cfg turns Wi-Fi off,
# this brings the stack back. mac80211_hwsim simulates radios, so Wi-Fi
# (wpa_supplicant against hostapd) is testable in QEMU on every target.
CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_WLAN=y
CONFIG_MAC80211_HWSIM=m
