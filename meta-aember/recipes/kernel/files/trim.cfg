# ===========================================================================
# Size trimming for all architectures (best effort, see aember-kernel.bb):
# subsystems aember never uses on its appliances. Merged before the
# required fragments, which always win. Options that something else still
# selects are reported as warnings, not errors.
# ===========================================================================

# Radio, audio, media
# CONFIG_SOUND is not set
# CONFIG_WIRELESS is not set
# CONFIG_WLAN is not set
# CONFIG_BT is not set
# CONFIG_NFC is not set
# CONFIG_WWAN is not set
# CONFIG_MEDIA_SUPPORT is not set
# CONFIG_RC_CORE is not set
# CONFIG_CAN is not set

# Driver trees aember doesn't need
# CONFIG_STAGING is not set
# CONFIG_INFINIBAND is not set
# CONFIG_IIO is not set
# CONFIG_INPUT_JOYSTICK is not set
# CONFIG_INPUT_TABLET is not set
# CONFIG_INPUT_TOUCHSCREEN is not set
# CONFIG_USB_GADGET is not set
# CONFIG_MTD is not set
# CONFIG_REMOTEPROC is not set
# CONFIG_RPMSG is not set
# CONFIG_DRM_NOUVEAU is not set
# CONFIG_DRM_AMDGPU is not set
# CONFIG_DRM_RADEON is not set
# (i915 stays: real x64 boxes use Intel graphics, and it provides DRM_TTM)

# Filesystems: root is ext4, containers are SquashFS + OverlayFS (+ FUSE)
# CONFIG_NETWORK_FILESYSTEMS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_XFS_FS is not set
# CONFIG_F2FS_FS is not set

# Hypervisor host / sleep states: not used by an appliance
# CONFIG_VIRTUALIZATION is not set
# CONFIG_KVM is not set
# CONFIG_HIBERNATION is not set

# Tracing and debug info (no ftrace/kprobes on devices; KALLSYMS stays for
# readable oops traces)
# CONFIG_FTRACE is not set
# CONFIG_KPROBES is not set
# CONFIG_PROFILING is not set
# CONFIG_KALLSYMS_ALL is not set
# CONFIG_DEBUG_FS is not set
CONFIG_DEBUG_INFO_NONE=y
# CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT is not set
# CONFIG_DEBUG_INFO_DWARF4 is not set
# CONFIG_DEBUG_INFO_DWARF5 is not set
# CONFIG_DEBUG_INFO is not set
