# ===============================
# Architecture (32-bit ARMv7-A, on top of multi_v7_defconfig)
# ===============================
CONFIG_ARCH_MULTI_V7=y
CONFIG_AEABI=y
CONFIG_VFP=y
CONFIG_VFPv3=y
CONFIG_NEON=y
CONFIG_MMU=y
# QEMU virt machine
CONFIG_ARCH_VIRT=y
# No LPAE: Cortex-A9 boards (i.MX6) don't have it
# CONFIG_ARM_LPAE is not set
CONFIG_HIGHMEM=y

# ===============================
# Early boot / console
# ===============================
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_SERIAL_CORE=y
CONFIG_SERIAL_CORE_CONSOLE=y
CONFIG_HVC_DRIVER=y

# Device Tree
CONFIG_OF=y
CONFIG_OF_FLATTREE=y
CONFIG_OF_EARLY_FLATTREE=y

# ===============================
# Init / PID1
# ===============================
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_DEFAULT_INIT="/init"

# ===============================
# Filesystems (minimal)
# ===============================
CONFIG_TMPFS=y

# ===============================
# Networking (basic, container-ready)
# ===============================
CONFIG_NET=y
CONFIG_INET=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_NETFILTER=y
# BRIDGE=y needs IPv6 built in
CONFIG_IPV6=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
# multi_v7_defconfig has no NAMESPACES; LXC needs all of them
CONFIG_NAMESPACES=y
CONFIG_NET_NS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y

# cgroup controllers multi_v7_defconfig leaves out (lxc-checkconfig lists
# them as missing; x64/arm64 defconfigs have them)
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_FREEZER=y
CONFIG_POSIX_MQUEUE=y

# ===============================
# Storage (basic block + initramfs)
# ===============================
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_VIRTIO_BLK=y
CONFIG_EXT4_FS=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y

# ===============================
# Device drivers (QEMU virt + boards)
# ===============================
# PCIe on QEMU virt (virtio devices)
CONFIG_PCI=y
CONFIG_PCI_HOST_GENERIC=y

CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y

# ===============================
# Security / hardening (lightweight)
# ===============================
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y

# ===============================
# Framebuffer / Display (virtio-gpu for QEMU)
# ===============================
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_DRM=y
# KMS/GEM/TTM helpers are selected by DRM_VIRTIO_GPU (as modules)
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_VIRTIO_GPU_KMS=y

# ===============================
# Input (needed for display)
# ===============================
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_VIRTIO_INPUT=m
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
