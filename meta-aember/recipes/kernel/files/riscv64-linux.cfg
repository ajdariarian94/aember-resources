# ===============================
# RISC-V 64 (riscv defconfig: QEMU virt, SiFive, StarFive, ...)
# ===============================
CONFIG_64BIT=y
CONFIG_MMU=y

# Serial console: the virt machine's (and most SoCs') 16550 UART, ttyS0;
# early output through the SBI firmware (earlycon=sbi)
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_OF_PLATFORM=y
CONFIG_SERIAL_EARLYCON_RISCV_SBI=y

# base.cfg empties SYSTEM_TRUSTED_KEYS, which only exists with the trusted
# keyring (the riscv defconfig has no module signing)
CONFIG_ASYMMETRIC_KEY_TYPE=y
CONFIG_ASYMMETRIC_PUBLIC_KEY_SUBTYPE=y
CONFIG_X509_CERTIFICATE_PARSER=y
CONFIG_SYSTEM_TRUSTED_KEYRING=y

# Device tree
CONFIG_OF=y

# ===============================
# Init / PID1
# ===============================
CONFIG_BINFMT_ELF=y
CONFIG_BINFMT_SCRIPT=y
CONFIG_DEFAULT_INIT="/init"
CONFIG_TMPFS=y
CONFIG_PROC_FS=y
CONFIG_SYSFS=y

# ===============================
# Containers: namespaces, cgroups, bridge, veth
# ===============================
CONFIG_NET=y
CONFIG_INET=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_IPV6=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_VETH=y
CONFIG_NAMESPACES=y
CONFIG_NET_NS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CPUSETS=y

# ===============================
# Storage
# ===============================
CONFIG_BLK_DEV=y
CONFIG_BLK_DEV_INITRD=y
CONFIG_VIRTIO_BLK=y
CONFIG_EXT4_FS=y
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y

# ===============================
# QEMU virt: PCIe (virtio, e1000e, i6300esb), virtio-mmio
# ===============================
CONFIG_PCI=y
CONFIG_PCI_HOST_GENERIC=y
CONFIG_VIRTIO_MENU=y
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_E1000E=y

# ===============================
# Display (virtio-gpu in QEMU) and input
# ===============================
CONFIG_DRM=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_DRM_VIRTIO_GPU=m
CONFIG_DRM_VIRTIO_GPU_KMS=y
CONFIG_FB=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_INPUT=y
CONFIG_INPUT_EVDEV=y
CONFIG_VIRTIO_INPUT=m
CONFIG_VT=y
CONFIG_VT_CONSOLE=y

# ===============================
# Hardening (lightweight)
# ===============================
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_HARDENED_USERCOPY=y
CONFIG_FORTIFY_SOURCE=y

CONFIG_DEBUG_KERNEL=n
CONFIG_PRINTK=y
