# Standard override for ARM64
MACHINEOVERRIDES =. "aarch64:"

# Generic aarch64: the Cortex-A53 tune (ARMv8.0-A) runs on every 64-bit Arm
# board: Raspberry Pi 3/4/Zero 2 W, i.MX8, Rockchip, Allwinner, QEMU virt.
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES = "115200;ttyAMA0"
PREFERRED_PROVIDER_virtual/kernel = "aember-kernel"

# ARM64 specific settings
DEFAULTTUNE = "cortexa53"
