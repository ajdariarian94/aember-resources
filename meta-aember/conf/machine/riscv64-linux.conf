# 64-bit RISC-V (RV64GC, Linux's baseline): QEMU virt and boards like the
# StarFive VisionFive 2 or Milk-V. One generic tune, like arm32.
require conf/machine/include/riscv/tune-riscv.inc

KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES = "115200;ttyS0"
PREFERRED_PROVIDER_virtual/kernel = "aember-kernel"

DEFAULTTUNE = "riscv64"
