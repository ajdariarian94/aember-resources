# 32-bit ARM (ARMv7-A, hard-float, NEON): one tune that runs on Cortex-A7,
# A9 and A15 boards (i.MX6, STM32MP1, Raspberry Pi 2) and QEMU virt.
require conf/machine/include/arm/arch-armv7a.inc

KERNEL_IMAGETYPE = "zImage"
SERIAL_CONSOLES = "115200;ttyAMA0"
PREFERRED_PROVIDER_virtual/kernel = "aember-kernel"

DEFAULTTUNE = "armv7athf-neon"
