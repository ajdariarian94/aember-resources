BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes/*/*.bb"

BBFILE_COLLECTIONS += "aember"
BBFILE_PATTERN_aember := "^${LAYERDIR}/"
BBFILE_PRIORITY_aember = "6"

# THIS IS THE COMPATIBILITY LIST
LAYERSERIES_COMPAT_aember = "whinlatter"

# bbappends: wpa-supplicant (poky) for the "wifi" package; hostapd only
# when meta-oe (openembedded-layer) is in the build (the "wifi-ap" chain).
BBFILES += "${LAYERDIR}/recipes/*/*.bbappend"
BBFILES_DYNAMIC += " \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*.bbappend \
"
